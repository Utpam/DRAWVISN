services:
  - type: web
    name: drawvisn-server
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: CLIENT_URL
        sync: false
